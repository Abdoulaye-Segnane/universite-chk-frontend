<div class="register-wrapper">
  <div class="register-left">
    <h2>{{ editMode ? 'Modifier un cours' : 'Créer un cours' }}</h2>

    <form [formGroup]="coursForm" (ngSubmit)="onSubmit()" class="cours-form">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre du cours</mat-label>
        <input matInput formControlName="titre" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3" cdkTextareaAutosize></textarea>
      </mat-form-field>      

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Formateur</mat-label>
        <input matInput formControlName="formateur" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date du cours</mat-label>
        <input matInput type="date" formControlName="date" required />
      </mat-form-field>

      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit" [disabled]="coursForm.invalid">
          {{ editMode ? 'Mettre à jour' : 'Créer le cours' }}
        </button>

        <button mat-stroked-button color="warn" [routerLink]="['/admin/cours']">
          Annuler
        </button>
      </div>

    </form>
  </div>

  <div class="register-right">
    <img src="/img/coursPage.webp" alt="Création cours UN-CHK" />
  </div>
</div>
