<mat-card class="card-container">
  <mat-card-title>Liste des cours</mat-card-title>

  <mat-card-content>
    <div class="table-container">
      <table mat-table [dataSource]="coursList" class="mat-elevation-z2">

        <!-- Titre -->
        <ng-container matColumnDef="titre">
          <th mat-header-cell *matHeaderCellDef> Titre </th>
          <td mat-cell *matCellDef="let cours"> {{ cours.titre }} </td>
        </ng-container>

        <!-- Formateur -->
        <ng-container matColumnDef="formateur">
          <th mat-header-cell *matHeaderCellDef> Formateur </th>
          <td mat-cell *matCellDef="let cours"> {{ cours.formateur }} </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let cours"> {{ cours.date | date:'dd/MM/yyyy' }} </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let cours">
            <div class="action-buttons">
              <button mat-icon-button (click)="editCours(cours.id)">
                <mat-icon color="primary">edit</mat-icon>
              </button>
              <button mat-icon-button (click)="deleteCours(cours.id)">
                <mat-icon color="warn">delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="add-cours-btn">
        <button mat-raised-button color="primary" (click)="addCours()">
          <mat-icon>note_add</mat-icon> Ajouter un cours
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
