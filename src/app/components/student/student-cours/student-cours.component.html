<h2>📚 Liste des cours disponibles</h2>

<table mat-table [dataSource]="courses" class="mat-elevation-z8">

  <ng-container matColumnDef="titre">
    <th mat-header-cell *matHeaderCellDef> Titre </th>
    <td mat-cell *matCellDef="let c"> {{ c.titre }} </td>
  </ng-container>

  <ng-container matColumnDef="formateur">
    <th mat-header-cell *matHeaderCellDef> Formateur </th>
    <td mat-cell *matCellDef="let c"> {{ c.formateur }} </td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let c"> {{ c.date }} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let c">
      <button mat-raised-button color="primary" (click)="consulterCours(c)">🔍 Consulter</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
