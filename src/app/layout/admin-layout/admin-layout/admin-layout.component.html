<mat-sidenav-container class="admin-container">

  <!-- Sidenav correctement intégré -->
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <h3>UN-CHK</h3>
    </div>

    <mat-nav-list>

      <a mat-list-item 
         routerLink="/admin/dashboard" 
         routerLinkActive="active-link" 
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon> Tableau de bord
      </a>

      <a mat-list-item 
         routerLink="/admin/students" 
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>person</mat-icon> Étudiants
      </a>

      <a mat-list-item 
         routerLink="/admin/cours" 
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>menu_book</mat-icon> Cours
      </a>

      <a mat-list-item 
         routerLink="/admin/messages" 
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>mail</mat-icon> Messages
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <!-- Contenu principal -->
  <mat-sidenav-content>

    <mat-toolbar color="primary">
      <span>Espace Administrateur</span>
      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <button mat-menu-item [routerLink]="['/admin/profile']">
          <mat-icon>person</mat-icon>
          <span>Mon profil</span>
        </button>
        <button mat-menu-item [routerLink]="['/admin/logout']">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="admin-main-content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
