[build]
command = "npm run build:ssr"
publish = "dist/frontend/browser"
functions = "dist/frontend/server"  # pour que Netlify cherche le SSR 

[dev]
command = "npm run dev:ssr"

[[redirects]]
  from = "/api/*"
  to = "https://example.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"  # pour router toutes les pages via le SSR 
  status = 200
